  const markdownText = "# Curated Public Trading Repositories & Extracted Strategy Playbook (Crypto Perpetual Futures Edition)\n\n> [!IMPORTANT]\n> All strategies in this document are specifically engineered for **Cryptocurrency Perpetual Futures** (`USDT-M` / `Coin-M`). Each model includes complete bi-directional logic (**Long & Short**), leverage-aware risk budgeting, asymmetric volatility buffers (accounting for rapid short-side flushes vs. gradual long-side grinds), and proper Jesse futures lifecycle methods.\n\n---\n\n## 1. Master Repository Directory\n\n| Repository | Focus / Domain | GitHub Stars | Core Strengths |\n|---|---|---|---|\n| [**freqtrade/freqtrade-strategies**](https://github.com/freqtrade/freqtrade-strategies) | Crypto Futures & Spot Library | 5,590 \u2605 | Extensive collection of bi-directional futures strategies: Supertrend, Keltner, Heikin-Ashi, dynamic stop-loss ladders, and hyperopt templates. |\n| [**iterativv/NostalgiaForInfinity**](https://github.com/iterativv/NostalgiaForInfinity) | Multi-Regime Production Strategy | 3,494 \u2605 | Advanced regime switching (Bull / Bear / Ranging), volatility trailing stops, volume flow, and exhaustion shorting/dip-buying. |\n| [**je-suis-tm/quant-trading**](https://github.com/je-suis-tm/quant-trading) | Classical Quantitative Models | 11,133 \u2605 | Clean Python implementations of Dual Thrust, London Breakout, Statistical Arbitrage / Pair Trading, and Monte Carlo engines. |\n| [**joshyattridge/smart-money-concepts**](https://github.com/joshyattridge/smart-money-concepts) | Institutional Order Flow (SMC) | 2,111 \u2605 | Algorithmic detection of Fair Value Gaps (FVG), Order Blocks (OB), Liquidity Sweeps, and Break of Structure (BoS/CHoCH). |\n| [**nautechsystems/nautilus_trader**](https://github.com/nautechsystems/nautilus_trader) | Institutional Event-Driven Engine | 30,878 \u2605 | Rust-core high-speed backtesting and live execution engine for tick-level and order-book microstructure data on futures exchanges. |\n| [**polakowo/vectorbt**](https://github.com/polakowo/vectorbt) | High-Speed Vector Backtesting | 9,546 \u2605 | Numba/NumPy accelerated matrix backtesting. Runs thousands of leverage and parameter combinations across multiple assets. |\n| [**microsoft/qlib**](https://github.com/microsoft/qlib) | AI & Machine Learning Alpha | 49,731 \u2605 | Full machine learning quant pipeline: alpha factor engineering, GBDT/neural net predictors, and portfolio risk attribution. |\n| [**stefan-jansen/machine-learning-for-trading**](https://github.com/stefan-jansen/machine-learning-for-trading) | Quant Finance Textbook Code | 21,553 \u2605 | End-to-end notebooks covering GARCH volatility, alternative data, factor modeling, and tree-based strategy optimization. |\n| [**hummingbot/hummingbot**](https://github.com/hummingbot/hummingbot) | Market Making & Arbitrage | 20,716 \u2605 | Leading platform for cross-exchange market making, perpetual funding rate arbitrage, and basis trading. |\n| [**gabrielweich/jesse-strategies**](https://github.com/gabrielweich/jesse-strategies) | Native Jesse Strategies | 28 \u2605 | Clean Jesse strategy implementations: Donchian Channels, Dave Landry 2-bar pullbacks, IFR2, and Simple Bollinger. |\n\n---\n\n## 2. Crypto Futures Market Mechanics & Best Practices\n\n```mermaid\nflowchart TD\n    subgraph Market_Dynamics[\"Crypto Futures Market Asymmetry\"]\n        A[\"Long Moves: Gradual accumulation, lower realized volatility\"]\n        B[\"Short Moves: Cascading liquidations, high spike volatility, rapid mean-reversion\"]\n    end\n\n    subgraph Risk_Controls[\"Perpetual Futures Risk Rules\"]\n        C[\"Position Sizing based on available_margin * risk_percent\"]\n        D[\"Hard Stop-Loss Placed Well Ahead of Liquidation Price\"]\n        E[\"Tighter Trailing Stops on Short Positions to Avoid V-Bounces\"]\n    end\n\n    Market_Dynamics --> Risk_Controls\n```\n\n1. **Leverage & Position Sizing**:\n   Never size trades from `self.balance` alone. In perpetual futures, derive quantity using `self.available_margin`, `self.leverage`, and the exchange fee rate:\n   ```python\n   qty = utils.size_to_qty(self.available_margin * 0.15, self.price, fee_rate=self.fee_rate, leverage=self.leverage)\n   ```\n2. **Asymmetric Long/Short Tuning**:\n   In crypto futures, upward rallies grind slowly while downward liquidations cascade rapidly. Short entry thresholds and stop losses must be tuned independently from long thresholds (e.g., faster profit taking and tighter trailing stops on shorts to protect against aggressive V-bottom short squeezes).\n3. **Liquidation Buffer**:\n   Every open position must have an immediate `stop_loss` assigned in `on_open_position`. The stop-loss distance must never exceed $50\\%$ of the liquidation distance.\n\n---\n\n## 3. Extracted Futures Strategy Archetypes\n\n---\n\n### Strategy 1: NostalgiaForInfinity (NFI) Bi-Directional Futures Scalper\n*Adapted from: [`iterativv/NostalgiaForInfinity`](https://github.com/iterativv/NostalgiaForInfinity)*\n\n#### \ud83d\udca1 The Core Edge\nTrades trend continuations and extreme exhaustion points. In bull regimes, it buys oversold dips; in bear regimes or when parabolic blow-offs occur, it shorts exhaustion tops and breakdown momentum.\n\n#### \ud83d\udcd0 Futures Rules\n* **Trend & Regime Filter**:\n  * Bull Regime: $\\text{Close} > \\text{EMA}_{200}$ and $\\text{EMA}_{50} > \\text{EMA}_{100}$\n  * Bear Regime: $\\text{Close} < \\text{EMA}_{200}$ and $\\text{EMA}_{50} < \\text{EMA}_{100}$\n* **Long Entry (Oversold Dip in Bull Trend)**:\n  * $\\text{Close} < \\text{BB}_{\\text{lower}} (20, 2\\sigma)$\n  * $\\text{RSI}_{14} < 32$\n  * Volume $> \\text{SMA}(\\text{Volume}, 30) \\times 1.2$\n* **Short Entry (Exhaustion Breakdown in Bear Trend)**:\n  * $\\text{Close} > \\text{BB}_{\\text{upper}} (20, 2\\sigma)$ or breaks below $\\text{Low}_{[-3]}$ in a confirmed bear regime\n  * $\\text{RSI}_{14} > 72$ (overbought top) OR $\\text{Close} < \\text{EMA}_{20}$ with high selling volume\n  * Volume $> \\text{SMA}(\\text{Volume}, 30) \\times 1.3$\n* **Exit Logic**:\n  * Longs take profit at $\\text{BB}_{\\text{mid}}$; trailing stop locks in $+1.5\\%$ profit.\n  * Shorts take profit at $\\text{BB}_{\\text{mid}}$ or $+2.5\\%$; tighter trailing stop ($0.8\\times \\text{ATR}$) to prevent short squeeze spikes.\n\n#### \ud83d\udcbb Jesse Futures Strategy Implementation\n```python\nfrom jesse.strategies import Strategy\nimport jesse.indicators as ta\nfrom jesse import utils\n\nclass NFIFutures(Strategy):\n    @property\n    def ema200(self):\n        return ta.ema(self.candles, period=200)\n\n    @property\n    def ema50(self):\n        return ta.ema(self.candles, period=50)\n\n    @property\n    def ema100(self):\n        return ta.ema(self.candles, period=100)\n\n    @property\n    def bb(self):\n        return ta.bollinger_bands(self.candles, period=20, dev=2.0)\n\n    @property\n    def rsi(self):\n        return ta.rsi(self.candles, period=14)\n\n    @property\n    def atr(self):\n        return ta.atr(self.candles, period=14)\n\n    @property\n    def volume_ma(self):\n        return ta.sma(self.candles[:, 5], period=30)\n\n    def should_long(self) -> bool:\n        bull_regime = self.close > self.ema200 and self.ema50 > self.ema100\n        oversold = self.close < self.bb.lowerband and self.rsi < 32\n        vol_surge = self.candles[-1, 5] > self.volume_ma * 1.2\n        return bull_regime and oversold and vol_surge\n\n    def should_short(self) -> bool:\n        bear_regime = self.close < self.ema200 and self.ema50 < self.ema100\n        overbought = self.close > self.bb.upperband and self.rsi > 68\n        vol_surge = self.candles[-1, 5] > self.volume_ma * 1.3\n        return bear_regime and overbought and vol_surge\n\n    def should_cancel(self) -> bool:\n        return True\n\n    def go_long(self):\n        qty = utils.size_to_qty(self.available_margin * 0.15, self.price, fee_rate=self.fee_rate, leverage=self.leverage)\n        self.buy = qty, self.price\n\n    def go_short(self):\n        qty = utils.size_to_qty(self.available_margin * 0.15, self.price, fee_rate=self.fee_rate, leverage=self.leverage)\n        self.sell = qty, self.price\n\n    def on_open_position(self, order):\n        if self.is_long:\n            self.stop_loss = self.position.qty, self.price - (self.atr * 2.0)\n            self.take_profit = self.position.qty, self.bb.middleband\n        elif self.is_short:\n            self.stop_loss = self.position.qty, self.price + (self.atr * 1.8)\n            self.take_profit = self.position.qty, self.bb.middleband\n\n    def update_position(self):\n        # Trailing stop logic for futures\n        if self.is_long and self.position.pnl_percentage > 1.5:\n            new_stop = self.price - (self.atr * 1.2)\n            if new_stop > self.average_stop_loss:\n                self.stop_loss = self.position.qty, new_stop\n        elif self.is_short and self.position.pnl_percentage > 1.5:\n            new_stop = self.price + (self.atr * 1.0)\n            if new_stop < self.average_stop_loss:\n                self.stop_loss = self.position.qty, new_stop\n```\n\n---\n\n### Strategy 2: Bi-Directional Triple-Supertrend Consensus System\n*Adapted from: [`freqtrade/freqtrade-strategies/user_data/strategies/Supertrend.py`](https://github.com/freqtrade/freqtrade-strategies/blob/master/user_data/strategies/Supertrend.py)*\n\n#### \ud83d\udca1 The Core Edge\nUses 3 Supertrend filters to capture sustained trends on crypto perpetual contracts while completely ignoring range-bound noise.\n* **Fast Supertrend ($ST_1$)**: Multiplier = $1.0$, ATR Period = $8$\n* **Medium Supertrend ($ST_2$)**: Multiplier = $3.0$, ATR Period = $12$\n* **Slow Supertrend ($ST_3$)**: Multiplier = $6.0$, ATR Period = $14$\n\n#### \ud83d\udcd0 Futures Rules\n* **Long Entry**: All 3 Supertrends flip GREEN (Bullish direction).\n* **Short Entry**: All 3 Supertrends flip RED (Bearish direction).\n* **Long Exit / Stop**: When Fast Supertrend ($ST_1$) flips RED.\n* **Short Exit / Stop**: When Fast Supertrend ($ST_1$) flips GREEN.\n\n#### \ud83d\udcbb Jesse Futures Implementation Pattern\n```python\nfrom jesse.strategies import Strategy\nimport jesse.indicators as ta\nfrom jesse import utils\n\nclass TripleSupertrendFutures(Strategy):\n    @property\n    def st_fast(self):\n        return ta.supertrend(self.candles, period=8, factor=1.0)\n\n    @property\n    def st_med(self):\n        return ta.supertrend(self.candles, period=12, factor=3.0)\n\n    @property\n    def st_slow(self):\n        return ta.supertrend(self.candles, period=14, factor=6.0)\n\n    def should_long(self) -> bool:\n        return (\n            self.close > self.st_fast.value and\n            self.close > self.st_med.value and\n            self.close > self.st_slow.value\n        )\n\n    def should_short(self) -> bool:\n        return (\n            self.close < self.st_fast.value and\n            self.close < self.st_med.value and\n            self.close < self.st_slow.value\n        )\n\n    def should_cancel(self) -> bool:\n        return True\n\n    def go_long(self):\n        qty = utils.size_to_qty(self.available_margin * 0.20, self.price, fee_rate=self.fee_rate, leverage=self.leverage)\n        self.buy = qty, self.price\n\n    def go_short(self):\n        qty = utils.size_to_qty(self.available_margin * 0.20, self.price, fee_rate=self.fee_rate, leverage=self.leverage)\n        self.sell = qty, self.price\n\n    def on_open_position(self, order):\n        if self.is_long:\n            self.stop_loss = self.position.qty, self.st_med.value\n        elif self.is_short:\n            self.stop_loss = self.position.qty, self.st_med.value\n\n    def update_position(self):\n        # Trailing stop follows the medium Supertrend line\n        if self.is_long:\n            if self.close < self.st_fast.value:\n                self.liquidate()\n            elif self.st_med.value > self.average_stop_loss:\n                self.stop_loss = self.position.qty, self.st_med.value\n        elif self.is_short:\n            if self.close > self.st_fast.value:\n                self.liquidate()\n            elif self.st_med.value < self.average_stop_loss:\n                self.stop_loss = self.position.qty, self.st_med.value\n```\n\n---\n\n### Strategy 3: Dual Thrust Asymmetric Futures Range Breakout\n*Adapted from: [`je-suis-tm/quant-trading`](https://github.com/je-suis-tm/quant-trading/blob/master/Dual%20Thrust%20backtest.py)*\n\n#### \ud83d\udca1 The Core Edge\nDual Thrust generates asymmetric breakout bands from the previous $N$-day range ($N=4$). In crypto futures, downward breakdowns occur with more violence, so $K_2$ is set tighter than $K_1$ ($K_1=0.55$, $K_2=0.45$) to capture short cascades faster.\n\n#### \ud83d\udcd0 Mathematical Rules\n$$\\text{Range} = \\max(HH - LC, \\, HC - LL)$$\n$$\\text{Upper Long Trigger} = \\text{Open}_{\\text{session}} + (K_1 \\times \\text{Range})$$\n$$\\text{Lower Short Trigger} = \\text{Open}_{\\text{session}} - (K_2 \\times \\text{Range})$$\n* **Long Entry**: Price crosses above $\\text{Upper Trigger}$.\n* **Short Entry**: Price crosses below $\\text{Lower Trigger}$.\n* **Exit**: Reverse position when the opposing threshold is penetrated or close at session end.\n\n---\n\n### Strategy 4: Smart Money Concepts \u2014 Bi-Directional FVG & Order Block Futures\n*Adapted from: [`joshyattridge/smart-money-concepts`](https://github.com/joshyattridge/smart-money-concepts/blob/master/smartmoneyconcepts/smc.py)*\n\n#### \ud83d\udca1 The Core Edge\nInstitutional liquidity hunt. In perpetual futures, large players push price through equal highs / equal lows (liquidity sweeps) to trigger retail stops, leaving a 3-candle Fair Value Gap (FVG) and an unmitigated Order Block (OB).\n\n```mermaid\nflowchart LR\n    subgraph Bullish_Setup[\"Bullish Order Flow\"]\n        B1[\"1. Liquidity Sweep below Equal Lows\"] --> B2[\"2. Aggressive Displacement Up\\n(Creates Bullish FVG)\"]\n        B2 --> B3[\"3. Limit Buy on Retracement into FVG / Bullish OB\"]\n    end\n\n    subgraph Bearish_Setup[\"Bearish Order Flow\"]\n        S1[\"1. Liquidity Sweep above Equal Highs\"] --> S2[\"2. Aggressive Displacement Down\\n(Creates Bearish FVG)\"]\n        S2 --> S3[\"3. Limit Sell on Retracement into FVG / Bearish OB\"]\n    end\n```\n\n#### \ud83d\udcd0 Algorithmic Rules\n* **Bullish FVG**: $\\text{Low}_{[\\text{Candle } t]} > \\text{High}_{[\\text{Candle } t-2]}$. Limit BUY placed at $\\text{Low}_{[\\text{Candle } t]}$. Stop-loss placed below $\\text{Low}_{[\\text{Candle } t-1]}$.\n* **Bearish FVG**: $\\text{High}_{[\\text{Candle } t]} < \\text{Low}_{[\\text{Candle } t-2]}$. Limit SELL placed at $\\text{High}_{[\\text{Candle } t]}$. Stop-loss placed above $\\text{High}_{[\\text{Candle } t-1]}$.\n* **Risk/Reward Target**: Minimum $1:2.5$ or $1:3.0$ targeting the opposing liquidity pool (Equal Highs or Lows).\n\n---\n\n### Strategy 5: Donchian Channel Bi-Directional Futures Trend (Turtle Model)\n*Adapted from: [`gabrielweich/jesse-strategies`](https://github.com/gabrielweich/jesse-strategies/blob/master/Donchian/__init__.py)*\n\n#### \ud83d\udca1 The Core Edge\nClassic trend following with a 200 SMA macro trend gate.\n* **Long Side**:\n  * Filter: $\\text{Close} > \\text{SMA}_{200}$\n  * Entry: $\\text{Close} > \\text{DonchianUpper}_{20}$\n  * Exit: $\\text{Close} < \\text{DonchianLower}_{10}$ (shorter exit channel locks in profit faster)\n* **Short Side**:\n  * Filter: $\\text{Close} < \\text{SMA}_{200}$\n  * Entry: $\\text{Close} < \\text{DonchianLower}_{20}$\n  * Exit: $\\text{Close} > \\text{DonchianUpper}_{10}$\n\n---\n\n### Strategy 6: Dave Landry Bi-Directional 2-Bar Pullback Swing\n*Adapted from: [`gabrielweich/jesse-strategies`](https://github.com/gabrielweich/jesse-strategies/blob/master/DaveLandry/__init__.py)*\n\n#### \ud83d\udca1 The Core Edge\nOptimized for 4h and 6h perpetual contracts.\n* **Long Pullback**: In an established uptrend ($\\text{Close} > \\text{SMA}_{20}$), wait for 2 consecutive lower lows ($\\text{Low}_{[-1]} < \\text{Low}_{[-2]} < \\text{Low}_{[-3]}$). Buy when price breaks above the previous high.\n* **Short Pullback**: In a downtrend ($\\text{Close} < \\text{SMA}_{20}$), wait for 2 consecutive higher highs ($\\text{High}_{[-1]} > \\text{High}_{[-2]} > \\text{High}_{[-3]}$). Short when price breaks below the previous low.\n\n---\n\n### Strategy 7: Cointegrated Pair Trading (Z-Score Futures Spread)\n*Adapted from: [`je-suis-tm/quant-trading`](https://github.com/je-suis-tm/quant-trading/blob/master/Pair%20Trading%20backtest.py)*\n\n#### \ud83d\udca1 The Core Edge\nMarket-neutral statistical arbitrage between two cointegrated perpetual futures (e.g. `ETH-USDT` and `BTC-USDT`):\n* When Z-Score of the spread exceeds $+2.0\\sigma$: **SHORT Asset A** and **LONG Asset B**.\n* When Z-Score of the spread drops below $-2.0\\sigma$: **LONG Asset A** and **SHORT Asset B**.\n* When Z-Score reverts to $0.0\\sigma$: Close both positions simultaneously.\n\n---\n\n### Strategy 8: Almgren-Chriss Optimal Futures Execution & TWAP\n*Adapted from: [`freqtrade/freqtrade-strategies/user_data/strategies/AlmgrenChrissStrategy.py`](https://github.com/freqtrade/freqtrade-strategies/blob/master/user_data/strategies/AlmgrenChrissStrategy.py)*\n\n#### \ud83d\udca1 The Core Edge\nSlices large leveraged position orders into optimal volume-weighted execution buckets to eliminate market slippage and order-book liquidity depletion on high-leverage perpetual contracts.\n\n---\n\n### Strategy 9: Volatility-Regime Parabolic SAR Trailing Scalper\n*Adapted from: [`freqtrade/freqtrade-strategies/user_data/strategies/CustomStoplossWithPSAR.py`](https://github.com/freqtrade/freqtrade-strategies/blob/master/user_data/strategies/CustomStoplossWithPSAR.py)*\n\n#### \ud83d\udca1 The Core Edge\nDynamic trailing stop engine designed specifically for leveraged perpetuals. Accelerates stop-loss tightening during high-velocity volatility spikes, preventing sharp flash-crashes from wiping out unrealized futures profits.\n\n---\n\n## 4. Key Jesse Futures Implementation Rules\n\nWhen coding any of these strategies in Jesse:\n1. **Never use fixed dollar sizes**: Always derive quantities using `utils.size_to_qty(self.available_margin * risk_percent, self.price, fee_rate=self.fee_rate, leverage=self.leverage)`.\n2. **Handle `on_open_position` properly**:\n   ```python\n   def on_open_position(self, order):\n       if self.is_long:\n           self.stop_loss = self.position.qty, self.price - (self.atr * 2.0)\n       elif self.is_short:\n           self.stop_loss = self.position.qty, self.price + (self.atr * 1.8)\n   ```\n3. **Trailing Stop Assignment**: Reassign `self.stop_loss = self.position.qty, new_stop` inside `update_position()`. Remember that for shorts, a tighter stop is *lower* (`new_stop < self.average_stop_loss`), whereas for longs, a tighter stop is *higher* (`new_stop > self.average_stop_loss`).\n";
